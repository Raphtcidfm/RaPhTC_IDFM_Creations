<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset=".55" stop-color="#0d2743"/><stop offset="1" stop-color="#1b1537"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#182536"/><stop offset="1" stop-color="#050912"/></linearGradient>
    <linearGradient id="blueBus" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5eb6ff"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="purpleBus" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="whiteBus" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#9fb5cc"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" opacity=".16"/></pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="330" cy="170" r="250" fill="#4ea1ff" opacity=".12" filter="url(#blur)"/>
  <circle cx="1580" cy="250" r="310" fill="#8b5cf6" opacity=".13" filter="url(#blur)"/>
  <path d="M0 570 L1920 470 L1920 1080 L0 1080Z" fill="url(#road)"/>
  <path d="M0 650 L1920 550" stroke="#4ea1ff" stroke-width="3" opacity=".15"/>
  <path d="M120 880 L520 850 M1420 770 L1790 745" stroke="#fff" stroke-width="8" stroke-dasharray="90 65" opacity=".16"/>
  <g opacity=".28" fill="#152b42">
    <path d="M0 520V390h95v-80h95v210h70V350h120v170h100V290h130v230H0Z"/>
    <path d="M1330 480V300h90v-70h100v250h80V330h120v150h70V270h130v210h100v-90h90v90Z"/>
  </g>
  <rect width="1920" height="1080" fill="url(#dots)" opacity=".25"/>

  <!-- Bus 1: Paris / IDFM inspired -->
  <g transform="translate(80 520) rotate(-4)" filter="url(#shadow)">
    <rect x="0" y="55" width="710" height="260" rx="38" fill="url(#whiteBus)"/>
    <rect x="36" y="78" width="355" height="118" rx="16" fill="#14253b"/>
    <rect x="408" y="78" width="265" height="118" rx="16" fill="#102136"/>
    <rect x="34" y="205" width="638" height="38" rx="10" fill="url(#blueBus)"/>
    <path d="M40 249h620" stroke="#fff" stroke-width="7" opacity=".55"/>
    <rect x="48" y="100" width="70" height="8" rx="4" fill="#64d8ff"/><rect x="130" y="100" width="95" height="8" rx="4" fill="#64d8ff" opacity=".6"/>
    <circle cx="145" cy="315" r="48" fill="#07101f"/><circle cx="145" cy="315" r="25" fill="#8ca0b8"/>
    <circle cx="585" cy="315" r="48" fill="#07101f"/><circle cx="585" cy="315" r="25" fill="#8ca0b8"/>
    <rect x="660" y="150" width="30" height="58" rx="12" fill="#f7d66b"/>
  </g>

  <!-- Bus 2: blue/purple creator bus -->
  <g transform="translate(1150 300) rotate(5)" filter="url(#shadow)" opacity=".88">
    <rect x="0" y="70" width="650" height="240" rx="42" fill="url(#purpleBus)"/>
    <rect x="42" y="95" width="265" height="100" rx="15" fill="#111c30"/>
    <rect x="324" y="95" width="270" height="100" rx="15" fill="#111c30"/>
    <path d="M28 205h585" stroke="#8fe7ff" stroke-width="34" opacity=".7"/>
    <path d="M40 245h565" stroke="#fff" stroke-width="5" opacity=".45"/>
    <circle cx="145" cy="310" r="45" fill="#050a12"/><circle cx="145" cy="310" r="22" fill="#8999ac"/>
    <circle cx="535" cy="310" r="45" fill="#050a12"/><circle cx="535" cy="310" r="22" fill="#8999ac"/>
  </g>

  <!-- Bus 3: distant articulated bus -->
  <g transform="translate(620 145) scale(.58)" opacity=".5" filter="url(#shadow)">
    <rect x="0" y="85" width="980" height="245" rx="42" fill="url(#blueBus)"/>
    <rect x="45" y="110" width="360" height="100" rx="15" fill="#101d2e"/>
    <rect x="440" y="110" width="220" height="100" rx="15" fill="#101d2e"/>
    <rect x="690" y="110" width="240" height="100" rx="15" fill="#101d2e"/>
    <path d="M30 220h920" stroke="#fff" stroke-width="28" opacity=".45"/>
    <circle cx="180" cy="330" r="45" fill="#050a12"/><circle cx="180" cy="330" r="21" fill="#8fa1b5"/>
    <circle cx="780" cy="330" r="45" fill="#050a12"/><circle cx="780" cy="330" r="21" fill="#8fa1b5"/>
  </g>

  <!-- Decorative route lines -->
  <g fill="none" stroke-linecap="round">
    <path d="M0 170 C350 40 580 320 900 150 S1450 20 1920 180" stroke="#4ea1ff" stroke-width="5" opacity=".18"/>
    <path d="M0 205 C360 80 570 350 920 180 S1450 50 1920 210" stroke="#8b5cf6" stroke-width="2" opacity=".18"/>
  </g>
  <rect width="1920" height="1080" fill="#020712" opacity=".38"/>
</svg>
